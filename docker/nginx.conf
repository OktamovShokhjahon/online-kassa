# TLS terminates here. Put real certificates in ./docker/certs (fullchain.pem, privkey.pem)
# or terminate TLS at your load balancer and use only the :80 server.
upstream kass_web { server web:3000; keepalive 16; }
upstream kass_api { server api:4000; keepalive 16; }

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;

  # Real client IP for rate limits and the audit log
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_http_version 1.1;
  proxy_set_header Connection "";

  # Login endpoints: a second line of defence next to the API's own limiter
  location ~ ^/api/v1/auth/(login|pin) {
    limit_req zone=auth burst=10 nodelay;
    proxy_pass http://kass_api;
  }

  # The agent's outgoing WebSocket
  location /api/v1/agent/ws {
    proxy_pass http://kass_api;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
  }

  location /api/ { proxy_pass http://kass_api; proxy_read_timeout 120s; }
  location /uploads/ { proxy_pass http://kass_api; expires 7d; }
  location / { proxy_pass http://kass_web; }
}
