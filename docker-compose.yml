# Production-like stack: MongoDB (replica set), API, web and an Nginx front.
#   cp .env.example .env   # fill in the secrets
#   docker compose up -d --build
#   docker compose exec api node dist/scripts/seed-superadmin.js
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      # initiates the single-node replica set on first start, then reports health
      test: >
        mongosh --quiet --eval
        "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017/onlinekass?replicaSet=rs0
      UPLOAD_DIR: /data/uploads
    depends_on:
      mongo: { condition: service_healthy }
    volumes: [uploads:/data/uploads]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args: { API_URL: http://api:4000 }
    restart: unless-stopped
    depends_on: [api]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80"]
    volumes: ["./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [web, api]

volumes:
  mongo-data:
  uploads:
