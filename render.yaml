# Render blueprint for the Online Kass API (Render → New → Blueprint → pick this repository).
# Secrets marked `sync: false` are asked for in the Render dashboard when the blueprint is created;
# they are never stored in this file. JWT secrets and the encryption key are generated by Render.
services:
  - type: web
    name: online-kass-api
    runtime: node
    # free sleeps after 15 minutes without traffic (first request then takes ~1 minute, and the
    # background jobs - scheduled prices, Telegram reports - pause). Use "starter" for a real shop.
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build -w @kass/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: RUN_WORKERS
        value: "true"
      - key: BCRYPT_COST
        value: "10"
      # MongoDB Atlas connection string (mongodb+srv://...). A URI without a database name uses MONGO_DB_NAME.
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: onlinekass
      # The Vercel address of the website, e.g. https://online-kass.vercel.app (CORS and links)
      - key: WEB_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      # The platform owner, created on the first start (nothing happens if it already exists)
      - key: SUPERADMIN_LOGIN
        value: admin
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: SUPERADMIN_FULL_NAME
        value: Platform Owner
